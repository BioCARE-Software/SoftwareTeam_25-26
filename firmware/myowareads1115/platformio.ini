; BioCARE PoC — MyoWare (bicep) -> ADS1115 -> ESP32 Dev
; Burst-count state machine (1..4 bursts -> held state 1..4)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  adafruit/Adafruit ADS1X15 @ ^2.5.0

build_flags =
  -D BIOCARE_SAMPLE_HZ=100
